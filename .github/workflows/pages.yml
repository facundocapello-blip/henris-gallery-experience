name: Publish Henris Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test calculations and validation
        run: node --test tests/domain.test.js
      - name: Prepare static files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js domain.js _site/
          cp assets/mascota-poses.png _site/assets/
          mkdir -p _site/muestra-mapeo _site/mapeo-v1
          mkdir -p _site/muestra-mapeo-v3
          cp preview/muestra-mapeo-v3/index.html _site/muestra-mapeo-v3/
          cp preview/muestra-mapeo/index.html preview/muestra-mapeo/excel-continuo.png _site/muestra-mapeo/
          cp preview/mapeo/Henris-mapeo-vista-previa.html _site/mapeo-v1/index.html
          touch _site/.nojekyll
      # Only this additional path is built from the reviewed PR; root/legacy previews remain from main.
      - name: Checkout isolated QA PR1 snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cedd0061e5fda8b3a1d3e40dee3797a5b7959c13
          path: _qa_pr1_source
          persist-credentials: false
      - name: Include QA PR1 in separate path
        run: |
          mkdir -p _site/qa-pr1/assets
          cp _qa_pr1_source/index.html _qa_pr1_source/legacy.html _qa_pr1_source/styles.css _qa_pr1_source/app.js _qa_pr1_source/domain.js _qa_pr1_source/experience.js _qa_pr1_source/experience-domain.js _qa_pr1_source/experience.css _site/qa-pr1/
          cp _qa_pr1_source/assets/mascota-poses.png _site/qa-pr1/assets/
      - name: Checkout Henris management panel snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 004a1e7336949bc44be83ccda2f44cca90b6bce8
          path: _panel_src
          persist-credentials: false
      - name: Include Henris management panel in isolated path
        run: |
          mkdir -p _site/panel-gestion
          cp _panel_src/preview/panel-gestion/index.html _panel_src/preview/panel-gestion/styles.css _panel_src/preview/panel-gestion/app.js _site/panel-gestion/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion/
      - name: Checkout premium Henris panel V2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1f2de7c9f93bf17176f0c349c9b397e6376e2521
          path: _panel_v2_src
          persist-credentials: false
      - name: Verify and stage premium simulator in separate URL
        run: |
          node --check _panel_v2_src/preview/panel-gestion/app.js
          mkdir -p _site/panel-gestion-v2
          cp _panel_v2_src/preview/panel-gestion/index.html _panel_v2_src/preview/panel-gestion/styles.css _panel_v2_src/preview/panel-gestion/app.js _site/panel-gestion-v2/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-v2/
      - name: Include independent mapping preview for rollback
        run: |
          node --check _panel_v2_src/preview/panel-gestion/app.js
          node --check _panel_v2_src/preview/panel-gestion/verify-mapping.mjs
          mkdir -p _site/panel-gestion-mapeo
          cp _panel_v2_src/preview/panel-gestion/index.html _panel_v2_src/preview/panel-gestion/styles.css _panel_v2_src/preview/panel-gestion/app.js _site/panel-gestion-mapeo/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-mapeo/
      - name: Checkout commercial presentation candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8370b8ae93cba792d1beedd0a2cd309337976585
          path: _presentation_src
          persist-credentials: false
      - name: Stage presentation without changing approved V2
        run: |
          node --check _presentation_src/preview/panel-gestion/app.js
          node --check _presentation_src/preview/panel-gestion/verify-presentation.mjs
          mkdir -p _site/panel-gestion-presentacion
          cp _presentation_src/preview/panel-gestion/index.html _presentation_src/preview/panel-gestion/styles.css _presentation_src/preview/panel-gestion/app.js _site/panel-gestion-presentacion/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-presentacion/
      - name: Checkout hands-on tutorial preview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0ad3fc795ef98b1651debe9f22f85360b25ce658
          path: _tutorial_src
          persist-credentials: false
      - name: Stage hands-on tutorial separately from approved V2
        run: |
          node --check _tutorial_src/preview/panel-gestion/app.js
          node --check _tutorial_src/preview/panel-gestion/verify-tutorial.mjs
          mkdir -p _site/panel-gestion-guia
          cp _tutorial_src/preview/panel-gestion/index.html _tutorial_src/preview/panel-gestion/styles.css _tutorial_src/preview/panel-gestion/app.js _site/panel-gestion-guia/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-guia/
      - name: Checkout compact mapping candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6e34f57c1a3ab8f41ce85177c0d615e6316b6e14
          path: _compact_mapping_src
          persist-credentials: false
      - name: Stage compact mapping separately from prior previews
        run: |
          node --check _compact_mapping_src/preview/muestra-mapeo-compacta/verify-live.mjs
          mkdir -p _site/muestra-mapeo-compacta
          cp _compact_mapping_src/preview/muestra-mapeo-compacta/index.html _compact_mapping_src/preview/muestra-mapeo-compacta/compact.css _site/muestra-mapeo-compacta/
          cp preview/muestra-mapeo/excel-continuo.png _site/muestra-mapeo-compacta/
      - name: Checkout V3 and V1 hybrid mockup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4dc49b2aac6d85cd1db919d97a80e784dcdca0b2
          path: _hybrid_mockup_src
          persist-credentials: false
      - name: Stage isolated hybrid mockup without altering previous versions
        run: |
          node --check _hybrid_mockup_src/preview/mapeo-hibrido-v3-v1/verify-live.mjs
          mkdir -p _site/mapeo-hibrido-v3-v1
          cp _hybrid_mockup_src/preview/mapeo-hibrido-v3-v1/index.html _site/mapeo-hibrido-v3-v1/
      - name: Checkout Pedido Obras Pagos mapping candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5c99ce785a51e5e2f65fff090144a0aaa6117c8a
          path: _pedidos_mapping_src
          persist-credentials: false
      - name: Stage order relationship mapping separately
        run: |
          node --check _pedidos_mapping_src/preview/mapeo-pedidos-relaciones/verify-live.mjs
          mkdir -p _site/mapeo-pedidos-relaciones
          cp _pedidos_mapping_src/preview/mapeo-pedidos-relaciones/index.html _site/mapeo-pedidos-relaciones/
      - name: Checkout Matias field-to-field mapping
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a3d572123812225278e28ed83c84a1478a9746c0
          path: _matias_fields_src
          persist-credentials: false
      - name: Stage isolated fields mapping without changing prior versions
        run: |
          node --check _matias_fields_src/preview/mapeo-campos-pedidos/verify-live.mjs
          node -e "const d=require('./_matias_fields_src/preview/mapeo-campos-pedidos/mapeo-verificado.json');if(d.sections.reduce((a,b)=>a+b.count,0)!==66||d.originColumns.length!==40)process.exit(1)"
          mkdir -p _site/mapeo-campos-pedidos
          cp _matias_fields_src/preview/mapeo-campos-pedidos/index.html _site/mapeo-campos-pedidos/
          cp _matias_fields_src/preview/mapeo-campos-pedidos/mapeo-verificado.json _site/mapeo-campos-pedidos/
      - name: Checkout unmodified Qwen review candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d5fee6a81edce3b21f81fd3552b5bef22e8c635e
          path: _qwen_preview_src
          persist-credentials: false
      - name: Stage Qwen original HTML in isolated URL
        run: |
          node --check _qwen_preview_src/preview/qwen-presentacion/verify-live.mjs
          mkdir -p _site/qwen-presentacion
          cp _qwen_preview_src/preview/qwen-presentacion/index.html _site/qwen-presentacion/index.html
      - name: Checkout Astra two-panel mapping
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c8bbf2c1d078b1369a2a7497528e43c64c08b090
          path: _astra_mapping_src
          persist-credentials: false
      - name: Stage isolated Astra mapping without touching approved releases
        run: |
          node --check _astra_mapping_src/preview/mapeo-astra-paneles/verify-live.mjs
          mkdir -p _site/mapeo-astra-paneles
          cp _astra_mapping_src/preview/mapeo-astra-paneles/index.html _site/mapeo-astra-paneles/
      - name: Checkout original Claude Haiku review
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c36328de5e24360eafc06e9c5ebffbf6b8645f2e
          path: _haiku_preview_src
          persist-credentials: false
      - name: Stage untouched Haiku presentation in isolated URL
        run: |
          node --check _haiku_preview_src/preview/claude-haiku-presentacion/verify-live.mjs
          mkdir -p _site/claude-haiku-presentacion
          cp _haiku_preview_src/preview/claude-haiku-presentacion/index.html _site/claude-haiku-presentacion/index.html
          cp _haiku_preview_src/preview/claude-haiku-presentacion/README.md _site/claude-haiku-presentacion/README.md
      - name: Checkout original Gemini review
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dc63981c7ea3a3ecb30caaa7292dd19516efbc77
          path: _gemini_preview_src
          persist-credentials: false
      - name: Stage Gemini mockup for independent review
        run: |
          node --check _gemini_preview_src/preview/gemini-presentacion/verify-live.mjs
          mkdir -p _site/gemini-presentacion
          cp _gemini_preview_src/preview/gemini-presentacion/index.html _site/gemini-presentacion/index.html
      - name: Checkout Matias 29/66 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4c97b742c40de8605176ad7d81bbd6f3e45fd2bf
          path: _matias_29_66_src
          persist-credentials: false
      - name: Stage isolated Matias 29/66 candidate
        run: |
          node --check _matias_29_66_src/preview/matias-propuesta-final/verify-live.mjs
          mkdir -p _site/matias-propuesta-final
          cp _matias_29_66_src/preview/matias-propuesta-final/index.html _site/matias-propuesta-final/index.html
      - name: Checkout Henris V4 Gemini integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 66dd1263092a138be13f771462e850f3c4c4b4e8
          path: _henris_v4_src
          persist-credentials: false
      - name: Stage V4 as independent preview
        run: |
          node --check _henris_v4_src/preview/henris-v4/verify-live.mjs
          mkdir -p _site/henris-v4
          cp _henris_v4_src/preview/henris-v4/index.html _site/henris-v4/index.html
      - name: Checkout Henris V4.1 iPhone destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 948765182d78aac3dd1351640c4703750a5ff245
          path: _henris_v4_iphone_src
          persist-credentials: false
      - name: Stage isolated Henris V4.1 iPhone review
        run: |
          node --check _henris_v4_iphone_src/preview/henris-v4-iphone/verify-live.mjs
          mkdir -p _site/henris-v4-iphone
          cp _henris_v4_iphone_src/preview/henris-v4-iphone/index.html _site/henris-v4-iphone/index.html
      - name: Checkout validated V4.3 staging snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 52813246ce4c92b65295a7a4e8dfa1de45fe1b8f
          path: _henris_v43_staging
          persist-credentials: false
      - name: Add V4.3 isolated staging URL
        run: |
          mkdir -p _site/staging/henris-v4-20261019
          cp _henris_v43_staging/staging/henris-v4-20261019/index.html _site/staging/henris-v4-20261019/index.html
          echo "249d0fcd8e2fd6632c44a2281a07b371cbf7d6fdb609c7ce47b130d9d8ad4aba  _site/staging/henris-v4-20261019/index.html" | sha256sum -c
      - name: Checkout exact animated reference for independent review
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e8434b7adfd9b2e1d0799a0815e4627fed3d9d56
          path: _original_animation_reference
          persist-credentials: false
      - name: Stage original animation without changing Henris
        run: |
          mkdir -p _site/referencia-animada-original
          cp _original_animation_reference/preview/referencia-animada-original/index.html _site/referencia-animada-original/index.html
      - name: Checkout isolated Gemini fusion candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 99dbc84f5cda13081ed3e5fa89ba572dec854845
          path: _gemini_fusion_candidate
          persist-credentials: false
      - name: Include Gemini fusion demo at separate STAGING URL
        run: |
          mkdir -p _site/staging/henris-gemini-fusion-20261020
          cp _gemini_fusion_candidate/staging/henris-gemini-fusion-20261020/index.html _site/staging/henris-gemini-fusion-20261020/index.html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Install verification tools
        run: |
          npm ci --no-audit --no-fund
          if command -v google-chrome >/dev/null 2>&1; then
            echo "HENRIS_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify published preview and preserved versions
        run: node preview/muestra-mapeo/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify V3 published hybrid experience
        run: node preview/muestra-mapeo-v3/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify published Henris management panel
        run: node _panel_src/preview/panel-gestion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify published premium simulator
        run: node _panel_v2_src/preview/panel-gestion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save actual premium browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-premium-browser-captures
          path: test-results/panel-premium-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify isolated mapping guide desktop and mobile
        run: node _panel_v2_src/preview/panel-gestion/verify-mapping.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-mapeo/
      - name: Verify mapping guide on approved V2 URL
        run: node _panel_v2_src/preview/panel-gestion/verify-mapping.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-v2/
      - name: Save actual mapping screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-mapping-browser-captures
          path: test-results/henris-mapeo-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify commercial presentation in published staging
        run: node _presentation_src/preview/panel-gestion/verify-presentation.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-presentacion/
      - name: Verify commercial presentation on approved V2 URL
        run: node _panel_v2_src/preview/panel-gestion/verify-presentation.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-v2/
      - name: Save real browser presentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-commercial-presentation-screenshots
          path: test-results/henris-presentacion-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify published interactive how-to tutorial in staging
        run: node _tutorial_src/preview/panel-gestion/verify-tutorial.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-guia/
      - name: Verify interactive usage tutorial on approved V2 URL
        run: node _panel_v2_src/preview/panel-gestion/verify-tutorial.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-v2/
      - name: Save tutorial browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-howto-tutorial-captures
          path: test-results/henris-tutorial-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify compact mapping preview in public browser
        run: node _compact_mapping_src/preview/muestra-mapeo-compacta/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save actual compact mapping screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-compact-mapping-screenshots
          path: test-results/henris-compact-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify V3 plus V1 static mapping mockup at public URL
        run: node _hybrid_mockup_src/preview/mapeo-hibrido-v3-v1/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Capture V3 plus V1 mockup at mobile tablet and desktop sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-v3-v1-hybrid-static-screenshots
          path: test-results/henris-hybrid-static-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify order relationship mapping on published preview
        run: node _pedidos_mapping_src/preview/mapeo-pedidos-relaciones/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save order mapping desktop mobile visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-pedidos-relaciones-captures
          path: test-results/henris-relaciones-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify current fields vs historical Excel mapping in public browser
        run: node _matias_fields_src/preview/mapeo-campos-pedidos/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save reviewed mapping screenshots desktop tablet and iPhone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-matias-field-mapping-screenshots
          path: test-results/henris-campos-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Qwen original HTML online
        run: node _qwen_preview_src/preview/qwen-presentacion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save Qwen desktop and iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-qwen-review-screenshots
          path: test-results/henris-qwen-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Astra split field mapping in public browser
        run: node _astra_mapping_src/preview/mapeo-astra-paneles/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save Astra mapping mobile tablet desktop visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-astra-two-panel-screenshots
          path: test-results/henris-astra-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify original Claude Haiku HTML in public browser
        run: node _haiku_preview_src/preview/claude-haiku-presentacion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save original Haiku screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-haiku-original-review-screenshots
          path: test-results/henris-haiku-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Gemini mockup as isolated public page
        run: node _gemini_preview_src/preview/gemini-presentacion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save Gemini mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-gemini-original-review
          path: test-results/henris-gemini-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Matias 29/66 candidate in public browser
        run: node _matias_29_66_src/preview/matias-propuesta-final/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save Matias 29/66 candidate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-matias-29-66-screenshots
          path: test-results/henris-matias-final-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify V4 original 29/66 mapping and mock transaction flows
        run: node _henris_v4_src/preview/henris-v4/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save Henris V4 desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-v4-matias-review
          path: test-results/henris-v4-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real AppSheet iPhone destination and 29-66 mapping
        run: node _henris_v4_iphone_src/preview/henris-v4-iphone/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Capture Henris V4.1 destination phone desktop tablet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-v4-iphone-review
