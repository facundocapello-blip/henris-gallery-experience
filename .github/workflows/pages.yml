name: Publish Henris Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test calculations and validation
        run: node --test tests/domain.test.js
      - name: Prepare static files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js domain.js _site/
          cp assets/mascota-poses.png _site/assets/
          mkdir -p _site/muestra-mapeo _site/mapeo-v1
          mkdir -p _site/muestra-mapeo-v3
          cp preview/muestra-mapeo-v3/index.html _site/muestra-mapeo-v3/
          cp preview/muestra-mapeo/index.html preview/muestra-mapeo/excel-continuo.png _site/muestra-mapeo/
          cp preview/mapeo/Henris-mapeo-vista-previa.html _site/mapeo-v1/index.html
          touch _site/.nojekyll
      # Only this additional path is built from the reviewed PR; root/legacy previews remain from main.
      - name: Checkout isolated QA PR1 snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cedd0061e5fda8b3a1d3e40dee3797a5b7959c13
          path: _qa_pr1_source
          persist-credentials: false
      - name: Include QA PR1 in separate path
        run: |
          mkdir -p _site/qa-pr1/assets
          cp _qa_pr1_source/index.html _qa_pr1_source/legacy.html _qa_pr1_source/styles.css _qa_pr1_source/app.js _qa_pr1_source/domain.js _qa_pr1_source/experience.js _qa_pr1_source/experience-domain.js _qa_pr1_source/experience.css _site/qa-pr1/
          cp _qa_pr1_source/assets/mascota-poses.png _site/qa-pr1/assets/
      - name: Checkout Henris management panel snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 004a1e7336949bc44be83ccda2f44cca90b6bce8
          path: _panel_src
          persist-credentials: false
      - name: Include Henris management panel in isolated path
        run: |
          mkdir -p _site/panel-gestion
          cp _panel_src/preview/panel-gestion/index.html _panel_src/preview/panel-gestion/styles.css _panel_src/preview/panel-gestion/app.js _site/panel-gestion/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion/
      - name: Checkout premium Henris panel V2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a7e45384fbb954f8b98515124bf516972171cf0d
          path: _panel_v2_src
          persist-credentials: false
      - name: Verify and stage premium simulator in separate URL
        run: |
          node --check _panel_v2_src/preview/panel-gestion/app.js
          mkdir -p _site/panel-gestion-v2
          cp _panel_v2_src/preview/panel-gestion/index.html _panel_v2_src/preview/panel-gestion/styles.css _panel_v2_src/preview/panel-gestion/app.js _site/panel-gestion-v2/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-v2/
      - name: Include independent mapping preview for rollback
        run: |
          node --check _panel_v2_src/preview/panel-gestion/app.js
          node --check _panel_v2_src/preview/panel-gestion/verify-mapping.mjs
          mkdir -p _site/panel-gestion-mapeo
          cp _panel_v2_src/preview/panel-gestion/index.html _panel_v2_src/preview/panel-gestion/styles.css _panel_v2_src/preview/panel-gestion/app.js _site/panel-gestion-mapeo/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-mapeo/
      - name: Checkout commercial presentation candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8370b8ae93cba792d1beedd0a2cd309337976585
          path: _presentation_src
          persist-credentials: false
      - name: Stage presentation without changing approved V2
        run: |
          node --check _presentation_src/preview/panel-gestion/app.js
          node --check _presentation_src/preview/panel-gestion/verify-presentation.mjs
          mkdir -p _site/panel-gestion-presentacion
          cp _presentation_src/preview/panel-gestion/index.html _presentation_src/preview/panel-gestion/styles.css _presentation_src/preview/panel-gestion/app.js _site/panel-gestion-presentacion/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-presentacion/
      - name: Checkout hands-on tutorial preview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0ad3fc795ef98b1651debe9f22f85360b25ce658
          path: _tutorial_src
          persist-credentials: false
      - name: Stage hands-on tutorial separately from approved V2
        run: |
          node --check _tutorial_src/preview/panel-gestion/app.js
          node --check _tutorial_src/preview/panel-gestion/verify-tutorial.mjs
          mkdir -p _site/panel-gestion-guia
          cp _tutorial_src/preview/panel-gestion/index.html _tutorial_src/preview/panel-gestion/styles.css _tutorial_src/preview/panel-gestion/app.js _site/panel-gestion-guia/
          cp _qa_pr1_source/domain.js _qa_pr1_source/experience-domain.js _site/panel-gestion-guia/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Install verification tools
        run: |
          npm ci --no-audit --no-fund
          if command -v google-chrome >/dev/null 2>&1; then
            echo "HENRIS_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify published preview and preserved versions
        run: node preview/muestra-mapeo/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify V3 published hybrid experience
        run: node preview/muestra-mapeo-v3/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify published Henris management panel
        run: node _panel_src/preview/panel-gestion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'

      - name: Verify published premium simulator
        run: node _panel_v2_src/preview/panel-gestion/verify-live.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Save actual premium browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-premium-browser-captures
          path: test-results/panel-premium-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify isolated mapping guide desktop and mobile
        run: node _panel_v2_src/preview/panel-gestion/verify-mapping.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-mapeo/
      - name: Verify mapping guide on approved V2 URL
        run: node _panel_v2_src/preview/panel-gestion/verify-mapping.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-v2/
      - name: Save actual mapping screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-mapping-browser-captures
          path: test-results/henris-mapeo-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify commercial presentation in published staging
        run: node _presentation_src/preview/panel-gestion/verify-presentation.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-presentacion/
      - name: Verify commercial presentation on approved V2 URL
        run: node _panel_v2_src/preview/panel-gestion/verify-presentation.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-v2/
      - name: Save real browser presentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-commercial-presentation-screenshots
          path: test-results/henris-presentacion-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify published interactive how-to tutorial in staging
        run: node _tutorial_src/preview/panel-gestion/verify-tutorial.mjs '${{ steps.deployment.outputs.page_url }}' panel-gestion-guia/
      - name: Save tutorial browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henris-howto-tutorial-captures
          path: test-results/henris-tutorial-*.png
          if-no-files-found: ignore
          retention-days: 7
